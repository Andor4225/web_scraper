[project]
name = "web-scraper"
version = "0.2.0"
description = "Concurrent, domain-constrained async web crawler that exports page metadata to JSON or CSV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5.3",
]

[project.scripts]
web-scraper = "web_scraper.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-aiohttp>=1.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["web_scraper"]
